<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Gastos Pessoais</title>
  <style>
    /* Reset básico e definição de fonte moderna */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Cartão principal do formulário */
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: #111827;
    }

    p.subtitulo {
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .grupo-campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f9fafb;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #10b981;
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #059669;
    }

    /* Estilo do botão quando está bloqueado durante o envio */
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    /* Caixas de feedback (Sucesso ou Erro) */
    .mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none; /* Começa invisível */
    }

    .mensagem.sucesso {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .mensagem.erro {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Controle de Gastos</h1>
    <p class="subtitulo">Registre suas despesas direto na planilha</p>

    <form id="formGastos">
      <div class="grupo-campo">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Almoço, Uber, Livro..." required>
      </div>

      <div class="grupo-campo">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="" disabled selected>Selecione uma categoria</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
          <option value="Estudos">Estudos</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="grupo-campo">
        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" step="0.01" min="0.01" placeholder="0.00" required>
      </div>

      <button type="submit" id="btnSalvar">Salvar Gasto</button>
    </form>

    <div id="caixaMensagem" class="mensagem"></div>
  </div>

  <script>
    // Cole aqui a URL gerada na implantação do seu Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-x4jVExD0mBIehpiG6b909ik0ViPEEsCFI7usdgq9ycuRR_r1rw1GoXfyu6mKtscF3Q/exec";

    const form = document.getElementById("formGastos");
    const btnSalvar = document.getElementById("btnSalvar");
    const caixaMensagem = document.getElementById("caixaMensagem");

    form.addEventListener("submit", function(evento) {
      // Impede que a página recarregue ao enviar o formulário
      evento.preventDefault();

      // Prepara a interface para o envio
      btnSalvar.disabled = true;
      btnSalvar.textContent = "Salvando...";
      caixaMensagem.style.display = "none";

      // Captura os valores digitados nos campos
      const dadosGasto = {
        descricao: document.getElementById("descricao").value.trim(),
        categoria: document.getElementById("categoria").value,
        valor: document.getElementById("valor").value
      };

      // Envia os dados para o Google Apps Script
      fetch(SCRIPT_URL, {
        method: "POST",
        // text/plain evita que o navegador faça uma verificação prévia de CORS (OPTIONS)
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(dadosGasto)
      })
      .then(resposta => resposta.json())
      .then(resultado => {
        if (resultado.status === "sucesso") {
          mostrarMensagem("Gasto salvo com sucesso na planilha!", "sucesso");
          form.reset(); // Limpa todos os campos do formulário
        } else {
          mostrarMensagem("Erro no servidor: " + resultado.mensagem, "erro");
        }
      })
      .catch(erro => {
        mostrarMensagem("Falha na conexão. Verifique a URL do script.", "erro");
        console.error("Erro detalhado:", erro);
      })
      .finally(() => {
        // Reativa o botão independentemente de ter dado certo ou errado
        btnSalvar.disabled = false;
        btnSalvar.textContent = "Salvar Gasto";
      });
    });

    // Função auxiliar para exibir alertas visuais na tela
    function mostrarMensagem(texto, tipo) {
      caixaMensagem.textContent = texto;
      caixaMensagem.className = "mensagem " + tipo;
      caixaMensagem.style.display = "block";
    }
  </script>

</body>
</html>
